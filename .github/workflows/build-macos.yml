name: build-macos

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac -- --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-GPT-macOS-${{ matrix.arch }}
          path: |
            desktop/release/DeepSeek-Harness-GPT-*-mac-${{ matrix.arch }}.dmg
            desktop/release/DeepSeek-Harness-GPT-*-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
